name: Project status

on:
  workflow_dispatch:
  schedule:
    - cron: "2,17,32,47 * * * *"
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, assigned, unassigned]
  issue_comment:
    types: [created, edited, deleted]
  pull_request_target:
    types: [opened, edited, closed, reopened, synchronize, converted_to_draft, ready_for_review, labeled, unlabeled]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: ["build-and-deploy", "build-non-main"]
    types: [requested, in_progress, completed]

permissions:
  actions: read
  checks: read
  contents: read
  issues: write
  pull-requests: write
  statuses: read

jobs:
  status:
    name: Project status
    runs-on: ubuntu-latest
    steps:
      # Public repositories cannot call a reusable workflow from a private
      # repository. Keep this pinned copy on the trusted default branch; on
      # pull_request_target we never check out or execute the PR head.
      - name: Check out the trusted status runner
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.repository.default_branch || github.ref }}
          persist-credentials: false
      - name: Update the fixed status Issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python .github/scripts/project_status.py
          --repo "$GITHUB_REPOSITORY"
          --trusted-marker-actors "$GITHUB_REPOSITORY_OWNER"

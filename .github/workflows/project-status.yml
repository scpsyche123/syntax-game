name: Project status

on:
  workflow_dispatch:
  schedule:
    - cron: "2,17,32,47 * * * *"
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, assigned, unassigned]
  issue_comment:
    types: [created, edited, deleted]
  pull_request_target:
    types: [opened, edited, closed, reopened, synchronize, converted_to_draft, ready_for_review, labeled, unlabeled]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: ["build-and-deploy", "build-non-main"]
    types: [requested, in_progress, completed]

permissions:
  actions: read
  checks: read
  contents: read
  issues: write
  pull-requests: write
  statuses: read

jobs:
  status:
    uses: scpsyche123/agent-conversation/.github/workflows/project-status.yml@main
    with:
      trusted-marker-actors: ${{ github.repository_owner }}
    permissions:
      actions: read
      checks: read
      contents: read
      issues: write
      pull-requests: write
      statuses: read
